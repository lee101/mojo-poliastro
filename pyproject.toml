[project]
name = "mojo-poliastro"
version = "0.1.0"
description = "poliastro's numeric orbital-mechanics core, implemented in Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
keywords = ["mojo", "poliastro", "orbital-mechanics", "astrodynamics", "performance"]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "poliastro==0.17.0"]

[project.urls]
Homepage = "https://github.com/lee101/mojo-poliastro"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
